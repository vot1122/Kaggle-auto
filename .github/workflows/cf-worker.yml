# ===========================================================================
# Cloudflare Worker — pull / push  (WZFIX J-24, secret-safe for a PUBLIC repo)
# ===========================================================================
# Reads and deploys the Worker at twilight-thunder-4d48 using a Cloudflare
# API token stored as a GitHub secret.
#
# SECRET SAFETY (public repo)
#   - The *pull* step REDACTS known secrets before committing AND before
#     printing: WORKER_SECRET -> __WORKER_SECRET__, cfut_... tokens -> __CF_TOKEN__.
#     A leak guard then fails the run if WORKER_SECRET still appears.
#   - The *push* step RESTORES the real value into a throwaway copy at /tmp
#     only, and uploads that - the repo file stays redacted.
#   - GitHub Actions secrets themselves are encrypted, write-only, and masked
#     in logs; a public repo does not expose them.
#   If your worker.js has a secret that is NOT WORKER_SECRET (some other key
#   hardcoded in), add it as a secret too and it gets scrubbed the same way.
#
# SETUP (one time)
#   Cloudflare -> My Profile -> API Tokens -> Create Token
#       template "Edit Cloudflare Workers", scope = your account. Copy it.
#   GitHub repo -> Settings -> Secrets and variables -> Actions -> add:
#       CLOUDFLARE_API_TOKEN  = <the token>
#       CLOUDFLARE_ACCOUNT_ID = b57e418ae51ac12fdb192ce8f9b999fe
#       WORKER_SECRET         = the same value as WORKER_SECRET in config.env
#   Then Actions -> "Cloudflare Worker (pull / push)" -> Run workflow:
#       action = pull  -> downloads the live worker.js into wzfix_deploy/ (redacted)
#       action = push  -> deploys wzfix_deploy/worker.js to Cloudflare
#
# The push uses PUT /workers/scripts/{name}/content, which updates script
# content WITHOUT touching config or metadata - so bindings/secrets persist.
# ===========================================================================
name: Cloudflare Worker (pull / push)

on:
  workflow_dispatch:
    inputs:
      action:
        description: "pull = download live worker.js into the repo | push = deploy repo worker.js"
        required: true
        default: "pull"
        type: choice
        options:
          - pull
          - push
      script_name:
        description: "Worker script name"
        required: true
        default: "twilight-thunder-4d48"
        type: string

permissions:
  contents: write

concurrency:
  group: cf-worker

jobs:
  cf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Verify the API token
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          set +e
          curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | jq .
          echo "(status above must be \"active\"; otherwise the token is wrong)"

      - name: Pull worker.js from Cloudflare (redacted)
        if: ${{ inputs.action == 'pull' }}
        env:
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          NAME: ${{ inputs.script_name }}
        run: |
          set -e
          mkdir -p wzfix_deploy
          echo "== GET /workers/scripts/$NAME =="
          code=$(curl -sS -o /tmp/worker.js -w "%{http_code}" \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$NAME" \
            -H "Authorization: Bearer $TOKEN")
          echo "status: $code  bytes: $(stat -c%s /tmp/worker.js 2>/dev/null)"
          if [ "$code" != "200" ] || [ ! -s /tmp/worker.js ]; then
            echo "== falling back to /content/v2 =="
            curl -sS -o /tmp/worker.js -w "status: %{http_code}\n" \
              "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$NAME/content/v2" \
              -H "Authorization: Bearer $TOKEN"
          fi
          # a module Worker may come back as multipart - extract the .js part
          python3 - <<'PY'
          data = open("/tmp/worker.js", "rb").read()
          if b"Content-Disposition" in data[:4000]:
              import re
              m = re.match(rb"\s*--([^\r\n]+)", data)
              if m:
                  for part in data.split(b"--" + m.group(1)):
                      head, _, body = part.partition(b"\r\n\r\n")
                      if b".js" in head:
                          open("/tmp/worker.js", "wb").write(body.rstrip(b"\r\n-"))
                          print("extracted multipart js part")
                          break
          else:
              print("raw content")
          PY
          cp /tmp/worker.js wzfix_deploy/worker.js

          # ---- scrub secrets BEFORE committing / printing ----
          if [ -n "${WORKER_SECRET:-}" ]; then
            sed -i "s|${WORKER_SECRET}|__WORKER_SECRET__|g" wzfix_deploy/worker.js
          fi
          if [ -n "${TOKEN:-}" ]; then
            sed -i "s|${TOKEN}|__CF_TOKEN__|g" wzfix_deploy/worker.js
          fi
          sed -i -E "s|cfut_[A-Za-z0-9_-]+|__CF_TOKEN__|g" wzfix_deploy/worker.js

          # ---- leak guard: refuse to commit if the secret survived ----
          if [ -n "${WORKER_SECRET:-}" ] && grep -q "${WORKER_SECRET}" wzfix_deploy/worker.js; then
            echo "LEAK GUARD FAILED - secret still present, not committing"; exit 1
          fi

          echo "--- size: $(stat -c%s wzfix_deploy/worker.js) bytes ---"
          echo "--- redactions: $(grep -c '__WORKER_SECRET__\|__CF_TOKEN__' wzfix_deploy/worker.js || true) ---"
          echo "--- first 200 bytes (already scrubbed) ---"
          head -c 200 wzfix_deploy/worker.js; echo

      - name: Commit the pulled worker.js
        if: ${{ inputs.action == 'pull' }}
        run: |
          git config user.name "sarvam-test"
          git config user.email "bot-test@users.noreply.github.com"
          git add wzfix_deploy/worker.js
          git commit -m "cf: pull worker.js from Cloudflare (${{ inputs.script_name }}) [redacted]" || echo "no changes"
          git push || echo "nothing to push"

      - name: Push worker.js to Cloudflare
        if: ${{ inputs.action == 'push' }}
        env:
          ACC: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          WORKER_SECRET: ${{ secrets.WORKER_SECRET }}
          NAME: ${{ inputs.script_name }}
        run: |
          set -e
          F=wzfix_deploy/worker.js
          [ -s "$F" ] || { echo "wzfix_deploy/worker.js missing or empty"; exit 1; }

          # restore real secrets into a throwaway copy - the repo file stays redacted
          T=/tmp/deploy-worker.js
          cp "$F" "$T"
          if [ -n "${WORKER_SECRET:-}" ]; then
            sed -i "s|__WORKER_SECRET__|${WORKER_SECRET}|g" "$T"
          fi
          if [ -n "${TOKEN:-}" ]; then
            sed -i "s|__CF_TOKEN__|${TOKEN}|g" "$T"
          fi

          if grep -q "export default" "$T"; then
            META='{"main_module":"worker.js"}'
            CT="application/javascript+module"
          else
            META='{"body_part":"worker.js"}'
            CT="application/javascript"
          fi
          echo "metadata: $META"
          curl -sS -X PUT \
            "https://api.cloudflare.com/client/v4/accounts/$ACC/workers/scripts/$NAME/content" \
            -H "Authorization: Bearer $TOKEN" \
            -F "metadata=$META;type=application/json" \
            -F "worker.js=@$T;type=$CT" | jq .

          echo "== verifying /health =="
          sleep 5
          curl -sS -m 30 "https://$NAME.joshifreefire-joshi.workers.dev/health" || true
          echo

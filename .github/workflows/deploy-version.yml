name: Deploy WZFIX Version

# One-shot: fetches the notebook from the Google Drive link (if set),
# applies the tools patch, commits it, then pushes the notebook to
# Kaggle (new version = fresh session).
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch notebook from Google Drive link
        run: |
          if [ -f wzfix_deploy/notebook_gdrive.txt ]; then
            URL=$(grep -o 'https://[^ ]*' wzfix_deploy/notebook_gdrive.txt | head -1)
            if [ -n "$URL" ]; then
              echo "fetching $URL"
              curl -sL "$URL" -o kaggle_notebook.py
              SZ=$(stat -c%s kaggle_notebook.py)
              if [ "$SZ" -lt 500000 ] || ! grep -q "Kaggle addition O" kaggle_notebook.py; then
                echo "Drive download failed or invalid (size=$SZ) — keeping repo notebook"
                git checkout -- kaggle_notebook.py
              else
                echo "notebook fetched from Google Drive ($SZ bytes)"
              fi
            fi
          else
            echo "no gdrive link file — using repo notebook"
          fi

      - name: Apply patch
        run: python deploy_patch.py

      - name: Commit patched notebook
        run: |
          git config user.name "sarvam-test"
          git config user.email "bot-test@users.noreply.github.com"
          git add kaggle_notebook.py
          git commit -m "wzfix: version deploy (notebook)" && git push || echo "no changes"

      - name: Install pinned Kaggle CLI
        run: pip install kaggle==1.6.17

      - name: Configure Kaggle credentials
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          mkdir -p ~/.kaggle
          printf '{"username":"%s","key":"%s"}\n' "$KAGGLE_USERNAME" "$KAGGLE_KEY" > ~/.kaggle/kaggle.json
          chmod 600 ~/.kaggle/kaggle.json

      - name: Capture current tunnel (pre-restart)
        id: pretunnel
        run: |
          T=$(curl -sS -m 20 "https://twilight-thunder-4d48.joshifreefire-joshi.workers.dev/health" 2>/dev/null | grep -o 'https://[-a-z0-9.]*trycloudflare.com' | head -1 || true)
          echo "pre-restart tunnel: ${T:-none}"
          echo "tnl=${T:-none}" >> $GITHUB_OUTPUT

      - name: Push notebook to Kaggle
        run: |
          ls
          kaggle kernels push -p .

      - name: Ensure the new version actually replaces the running bot
        timeout-minutes: 25
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          set +e
          MAIN="https://twilight-thunder-4d48.joshifreefire-joshi.workers.dev"
          NB="${{ secrets.KAGGLE_NOTEBOOK }}"
          NBUSER="${NB%%/*}"
          NBSLUG="${NB#*/}"
          PREV_TNL="${{ steps.pretunnel.outputs.tnl }}"
          REPUSHED=0
          echo "previous tunnel: $PREV_TNL"
          echo "(a push alone does not restart a running session; from v15.78 the"
          echo " notebook exits itself when the repo build changes)"
          for i in $(seq 1 60); do
            H=$(curl -sS -m 20 "$MAIN/health" 2>/dev/null || echo '{}')
            RESP=$(echo "$H" | grep -o '"bot_responding": *[a-z]*' | head -1 | grep -o 'true\|false' || echo '?')
            TNL=$(echo "$H" | grep -o 'https://[-a-z0-9.]*trycloudflare.com' | head -1)
            ST=$(curl -sS -m 20 -u "$KAGGLE_USERNAME:$KAGGLE_KEY" "https://www.kaggle.com/api/v1/kernels/status?user_name=$NBUSER&kernel_slug=$NBSLUG" 2>/dev/null | grep -o '"status":"[^"]*"' | head -1 | cut -d'"' -f4)
            echo "[$i] kaggle=$ST bot_responding=$RESP tunnel=${TNL:-none}"
            if [ "$RESP" = "true" ] && [ -n "$TNL" ] && [ "$TNL" != "$PREV_TNL" ]; then
              echo "NEW SESSION IS UP: $TNL"
              exit 0
            fi
            if [ "$RESP" != "true" ] && [ "$ST" != "running" ] && [ -n "$ST" ]; then
              if [ "$REPUSHED" -lt 2 ]; then
                REPUSHED=$((REPUSHED+1))
                echo "old session ended and nothing is running - re-pushing to start the new run"
                kaggle kernels push -p . || true
              fi
            fi
            sleep 20
          done
          echo "WARNING: could not confirm the new session came up (old session may still be running)"

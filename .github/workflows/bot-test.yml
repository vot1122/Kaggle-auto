name: Bot Test

# Runs one test scenario against the WZML-X bot using the test account
# session (TG_TEST_SESSION repo secret, or TEST_SESSION in the private
# Kaggle config dataset). Results are committed to bot_test/last-result.md
# (public, but no secrets in it).
#
# The runner installs wzgram (Pyrogram fork) instead of pyrofork: it is a
# drop-in `pyrogram` module AND natively parses WZGram WZ_ session
# strings (checksummed V3 format).

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: "ping | artist | song | cmd | ld"
        required: true
        default: "ping"
        type: string
      arg:
        description: "optional argument (artist URL, /ld query, flags like -z)"
        required: false
        default: ""
        type: string

permissions:
  contents: write

concurrency:
  group: bot-test

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
          pip install telethon wzgram kaggle

      - name: Run test
        env:
          TG_TEST_SESSION: ${{ secrets.TG_TEST_SESSION }}
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          kaggle datasets download djoshi7/wzmlx-config -p cfg --unzip
          python bot_test/run_test.py --scenario "${{ inputs.scenario }}" --arg="${{ inputs.arg }}"

      - name: Commit results
        if: always()
        run: |
          git config user.name "sarvam-test"
          git config user.email "bot-test@users.noreply.github.com"
          git add bot_test/last-result.md || true
          git commit -m "bot-test results: ${{ inputs.scenario }}" && git push || echo "no result changes"

# ============================================================
# GitHub Actions Workflow - WZML-X Kaggle Schedule (v6.1)
# ============================================================
#
# SCHEDULE (IST, GitHub runs in UTC):
#   06:00 IST = Morning start (randomized 06:00-06:30 by manager)
#   07:00 IST = Health check (ensure bot is running)
#   15:00 IST = Midday health (ensure bot is running)
#   22:30 IST = Evening stop (randomized 22:30-23:00 by manager)
#
# UTC conversions (IST = UTC + 5:30):
#   06:00 IST = 00:30 UTC
#   07:00 IST = 01:30 UTC
#   15:00 IST = 09:30 UTC
#   22:30 IST = 17:00 UTC
#
# REQUIRED GITHUB SECRETS:
#   KAGGLE_USERNAME   - Kaggle username
#   KAGGLE_KEY        - Kaggle API key
#   KAGGLE_NOTEBOOK   - Notebook slug (username/notebook-title)
#
# OPTIONAL (for workflow notifications):
#   NTFY_TOPIC  - ntfy.sh topic
#   TG_BOT_TOKEN - Bot token
#   TG_CHAT_ID   - Your Telegram user ID
#
# OPTIONAL (full Spotify discography for artist links):
#   SPOTIFY_CLIENT_ID / SPOTIFY_CLIENT_SECRET - your Spotify app
#   credentials (developer.spotify.com dashboard). When set, they
#   are synced automatically into the Kaggle config dataset on every
#   run (only when the values change). Without them the bot uses
#   Spotify's anonymous web-player token, which also works but has
#   shared per-IP quotas. Secrets are never committed to this repo
#   or written into the public notebook - they live only in the
#   private Kaggle config dataset.
#
# PLACE AT: .github/workflows/kaggle_schedule.yml
# ============================================================

name: WZML-X Schedule

on:
  schedule:
    - cron: "30 0 * * *"  # 06:00 IST - morning start
    - cron: "30 1 * * *"  # 07:00 IST - morning health check
    - cron: "30 9 * * *"  # 15:00 IST - midday health check
    - cron: "0 17 * * *"  # 22:30 IST - evening stop
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to run (auto = decide from time of day)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - start
          - ensure
          - stop
      nb_url:
        description: 'Optional URL to fetch kaggle_notebook.py from (commits to repo before running)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  manage-kaggle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      SPOTIFY_CID: ${{ secrets.SPOTIFY_CLIENT_ID }}
      SPOTIFY_CSEC: ${{ secrets.SPOTIFY_CLIENT_SECRET }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Update notebook from URL (optional)
      if: ${{ github.event_name == 'workflow_dispatch' && inputs.nb_url != '' }}
      run: |
        echo "Fetching kaggle_notebook.py from URL..."
        curl -fsSL "${{ inputs.nb_url }}" -o kaggle_notebook.py
        SHA=$(sha256sum kaggle_notebook.py | cut -d' ' -f1)
        SIZE=$(stat -c%s kaggle_notebook.py)
        echo "Fetched: ${SIZE} bytes, sha256 ${SHA}"
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add kaggle_notebook.py
        git commit -m "WZFIX: update kaggle_notebook.py from URL" || echo "No changes to commit"
        git push

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install Kaggle CLI (pinned to 1.6.17 for legacy auth)
      run: |
        pip install --upgrade pip
        pip install kaggle==1.6.17

    - name: Sync Spotify credentials to Kaggle config (optional)
      if: ${{ env.SPOTIFY_CID != '' && env.SPOTIFY_CSEC != '' }}
      env:
        SPID: ${{ env.SPOTIFY_CID }}
        SPEC: ${{ env.SPOTIFY_CSEC }}
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
      run: |
        set -e
        mkdir -p /tmp/cfgsync && cd /tmp/cfgsync
        kaggle datasets download djoshi7/wzmlx-config -p . --unzip --force >/dev/null 2>&1 || true
        if [ ! -f config.env ]; then
          echo "config.env not found in the dataset - skipping secret sync"
          exit 0
        fi
        if grep -q "^SPOTIFY_CLIENT_ID=\"$SPID\"" config.env && grep -q "^SPOTIFY_CLIENT_SECRET=\"$SPEC\"" config.env; then
          echo "Spotify credentials already up to date - nothing to push"
          exit 0
        fi
        if grep -q "^SPOTIFY_CLIENT_ID=" config.env; then
          sed -i "s|^SPOTIFY_CLIENT_ID=.*|SPOTIFY_CLIENT_ID=\"$SPID\"|" config.env
        else
          printf 'SPOTIFY_CLIENT_ID="%s"\n' "$SPID" >> config.env
        fi
        if grep -q "^SPOTIFY_CLIENT_SECRET=" config.env; then
          sed -i "s|^SPOTIFY_CLIENT_SECRET=.*|SPOTIFY_CLIENT_SECRET=\"$SPEC\"|" config.env
        else
          printf 'SPOTIFY_CLIENT_SECRET="%s"\n' "$SPEC" >> config.env
        fi
        cat > dataset-metadata.json <<'META'
        {
          "title": "wzmlx-config",
          "id": "djoshi7/wzmlx-config",
          "licenses": [{"name": "CC0-1.0"}]
        }
        META
        kaggle datasets version -p . -m "sync Spotify credentials from GitHub secrets" --dir-mode skip
        echo "Spotify credentials synced into the Kaggle config dataset"

    - name: Determine action from trigger
      id: action
      run: |
        FORCED_ACTION="${{ github.event.inputs.action }}"
        if [[ -n "$FORCED_ACTION" && "$FORCED_ACTION" != "auto" ]]; then
          echo "action=$FORCED_ACTION" >> $GITHUB_OUTPUT
          echo "Forced action: $FORCED_ACTION (manual override)"
          exit 0
        fi
        UTC_HOUR=$(date -u +"%H")
        UTC_MIN=$(date -u +"%M")
        echo "UTC time: ${UTC_HOUR}:${UTC_MIN}"

        if [[ "$UTC_HOUR" -eq 0 && "$UTC_MIN" -ge 25 ]] ||            [[ "$UTC_HOUR" -eq 1 && "$UTC_MIN" -le 5 ]]; then
          echo "action=start" >> $GITHUB_OUTPUT
        elif [[ "$UTC_HOUR" -eq 1 && "$UTC_MIN" -ge 25 ]] ||            [[ "$UTC_HOUR" -eq 2 && "$UTC_MIN" -le 5 ]]; then
          echo "action=ensure" >> $GITHUB_OUTPUT
        elif [[ "$UTC_HOUR" -eq 9 && "$UTC_MIN" -ge 25 ]] ||            [[ "$UTC_HOUR" -eq 10 && "$UTC_MIN" -le 5 ]]; then
          echo "action=ensure" >> $GITHUB_OUTPUT
        elif [[ "$UTC_HOUR" -eq 16 && "$UTC_MIN" -ge 55 ]] ||            [[ "$UTC_HOUR" -eq 17 && "$UTC_MIN" -le 30 ]]; then
          echo "action=stop" >> $GITHUB_OUTPUT
        else
          echo "action=ensure" >> $GITHUB_OUTPUT
        fi

    - name: Run Kaggle Manager
      env:
        KAGGLE_FORCE: ${{ github.event.inputs.action == 'start' && '1' || '0' }}
        KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
        KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        KAGGLE_NOTEBOOK: ${{ secrets.KAGGLE_NOTEBOOK }}
        NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
        TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
      run: |
        echo "Action: ${{ steps.action.outputs.action }}"
        python kaggle_manager.py ${{ steps.action.outputs.action }}

    - name: Summary
      if: always()
      run: |
        echo "================================"
        echo " WZML-X Schedule Complete"
        echo " Action: ${{ steps.action.outputs.action }}"
        echo " Time: $(date)"
        echo "================================"

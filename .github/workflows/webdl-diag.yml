name: WebDL Diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: probe v19.1.0
        run: |
          W="https://twilight-thunder-4d48.joshifreefire-joshi.workers.dev"
          P="https://vot1122.github.io/ytwebdownload"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "=== version (expect v19.1.0) ==="
          curl -sS -m 40 -A "$UA" "$W/webdl/api/version"; echo; echo
          echo "=== endpoints locked without owner auth ==="
          for ep in admin/allow admin/site admin/invites admin/disk admin/reload admin/tg_test admin/unban_all protect history state; do
            c=$(curl -sS -m 25 -A "$UA" -X POST -H 'Content-Type: application/json' -d '{}' -o /dev/null -w "%{http_code}" "$W/webdl/api/$ep")
            echo "  $ep -> $c"
          done
          echo
          echo "=== dotted username must be refused, not crash ==="
          curl -sS -m 25 -A "$UA" -H 'Content-Type: application/json' \
            -d '{"invite":"WZ-NOPE","user":"d.j","pass":"test1234","fp":"fdiagp9","dev":"diagp9"}' \
            -o /tmp/dj -w "code=%{http_code}\n" "$W/webdl/api/login"
          cat /tmp/dj; echo; echo
          echo "=== guest network rule + naming ==="
          curl -sS -m 25 -A "$UA" -H 'Content-Type: application/json' \
            -d '{"guest":1,"dev":"diagp9","fp":"fdiagp9"}' \
            -o /tmp/g -w "code=%{http_code}\n" "$W/webdl/api/login"
          cat /tmp/g; echo; echo
          echo "=== page: guard tab + guest info + username rule shown ==="
          curl -sS -m 30 -A "$UA" -o /tmp/p4 "$P/"
          for kw in "['guard','" "data-act=\"allowip\"" "data-act=\"allowdel\"" "data-act=\"attclear\"" "data-act=\"ginfo\"" "Blocked signup attempts" "One-time IP passes" "no dots or symbols" "data-act=\"settings\"" "AudioContext"; do
            if grep -q "$kw" /tmp/p4; then echo "PASS: $kw"; else echo "FAIL: $kw"; fi
          done

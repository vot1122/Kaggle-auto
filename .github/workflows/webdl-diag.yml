name: WebDL Diag

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: Probe the live webdl endpoints
        run: |
          W="https://twilight-thunder-4d48.joshifreefire-joshi.workers.dev"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          for p in /health /webdl /wzadmin; do
            echo "=== GET $W$p ==="
            curl -sS -m 30 -A "$UA" -o /tmp/body -w "code=%{http_code} size=%{size_download}\n" "$W$p" || echo CURL_FAIL
            head -c 300 /tmp/body 2>/dev/null; echo; echo
          done
          echo "=== POST login joshi ==="
          curl -sS -m 30 -A "$UA" -H "Content-Type: application/json" \
            -d '{"pass":"joshi"}' -o /tmp/login -w "code=%{http_code}\n" "$W/webdl/api/login"
          cat /tmp/login; echo
          TOK=$(python3 -c "import json;print(json.load(open('/tmp/login')).get('token',''))" 2>/dev/null)
          echo "=== GET state (auth) ==="
          curl -sS -m 30 -A "$UA" -H "Authorization: Bearer $TOK" -o /tmp/state -w "code=%{http_code}\n" "$W/webdl/api/state"
          head -c 400 /tmp/state; echo

name: WebDL Diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: probe v19.2.0
        run: |
          W="https://twilight-thunder-4d48.joshifreefire-joshi.workers.dev"
          P="https://vot1122.github.io/ytwebdownload"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "=== version (expect v19.2.0) ==="
          curl -sS -m 40 -A "$UA" "$W/webdl/api/version"; echo; echo
          echo "=== quick endpoints ==="
          c=$(curl -sS -m 25 -A "$UA" -X POST -H 'Content-Type: application/json' -d '{}' -o /tmp/aq -w "%{http_code}" "$W/webdl/api/admin/quick")
          echo "  admin/quick -> $c"; cat /tmp/aq; echo
          c=$(curl -sS -m 25 -A "$UA" -X POST -H 'Content-Type: application/json' -d '{"fp":"fdiagq1","dev":"diagq1"}' -o /tmp/q -w "%{http_code}" "$W/webdl/api/quick")
          echo "  quick (self-service) -> $c"; cat /tmp/q; echo; echo
          echo "=== page checks ==="
          curl -sS -m 30 -A "$UA" -o /tmp/p5 "$P/"
          for kw in 'data-act="quick"' 'data-act="qkcopy"' 'data-act="qkgo"' 'id="quickBox"' 'data-act="adminquick"' 'Quick accounts' 'Create a quick account' 'data-act="allowip"' 'data-act="ginfo"'; do
            if grep -q "$kw" /tmp/p5; then echo "PASS: $kw"; else echo "FAIL: $kw"; fi
          done

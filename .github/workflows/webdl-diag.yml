name: WebDL Kernel Log

on:
  workflow_dispatch:

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Pull the running kernel log
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          NB="${{ secrets.KAGGLE_NOTEBOOK }}"
          echo "notebook: $NB"
          pip install -q kaggle==1.6.17
          mkdir -p /tmp/kout
          kaggle kernels output "$NB" -p /tmp/kout || echo "OUTPUT_PULL_FAILED"
          ls -la /tmp/kout
          for f in /tmp/kout/*.log /tmp/kout/*.txt; do
            [ -f "$f" ] || continue
            echo "===== $f (r17/r2/errors) ====="
            grep -n -i "r17\|r2: \|r2 wserver\|error\|failed\|anchor\|exception\|Traceback\|wserver\|stream server\|patch kit\|addition" "$f" | tail -120
            echo "===== $f (tail 40) ====="
            tail -40 "$f"
          done

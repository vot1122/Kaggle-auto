name: WebDL Diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: probe
        run: |
          W="https://twilight-thunder-4d48.joshifreefire-joshi.workers.dev"
          P="https://vot1122.github.io/ytwebdownload"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "=== worker version (expect v16.5.0) ==="
          curl -sS -m 30 -A "$UA" -o /tmp/v -w "code=%{http_code}\n" "$W/webdl/api/version"
          cat /tmp/v; echo; echo
          echo "=== Pages page has why-rendering + backend.json fetch, no baked URL ==="
          curl -sS -m 30 -A "$UA" -o /tmp/p2 -w "code=%{http_code}\n" "$P/"
          if grep -q "t.why" /tmp/p2; then echo "PASS: task why rendering present"; else echo "FAIL: no t.why"; fi
          if grep -q "d.why" /tmp/p2; then echo "PASS: formats why present"; else echo "FAIL: no d.why"; fi
          if grep -q "backend.json" /tmp/p2; then echo "PASS: backend.json fetch present"; else echo "FAIL: no backend.json fetch"; fi
          if grep -q "DEFAULT_API" /tmp/p2; then echo "FAIL: DEFAULT_API in page"; else echo "PASS: no DEFAULT_API"; fi
          if grep -qE "https://[a-z0-9-]+\.workers\.dev" /tmp/p2; then echo "FAIL: worker URL in page"; else echo "PASS: no worker URL in page"; fi
          echo "=== Pages backend.json ==="
          curl -sS -m 30 -A "$UA" -o /tmp/b -w "code=%{http_code}\n" "$P/backend.json"
          cat /tmp/b; echo; echo
          echo "=== guest login via Pages-resolved backend ==="
          curl -sS -m 30 -A "$UA" -H 'Content-Type: application/json' \
            -d '{"guest":1,"dev":"diagprobe50","fp":"fdiagprobe50"}' \
            -o /tmp/g -w "code=%{http_code}\n" "$W/webdl/api/login"
          cat /tmp/g; echo; echo
          echo "=== formats on a bad link: error + why present ==="
          curl -sS -m 40 -A "$UA" -H 'Content-Type: application/json' \
            -d '{"url":"https://example.com/definitely-not-a-video-xyz"}' \
            -o /tmp/f -w "code=%{http_code}\n" "$W/webdl/api/formats"
          cat /tmp/f; echo

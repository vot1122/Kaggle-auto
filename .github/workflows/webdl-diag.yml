name: WebDL Diag
on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    permissions: {contents: read}
    steps:
      - name: probe
        run: |
          W="https://twilight-thunder-4d48.joshifreefire-joshi.workers.dev"
          P="https://vot1122.github.io/ytwebdownload"
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36"
          echo "=== worker version (expect v18.0.0) ==="
          curl -sS -m 40 -A "$UA" -o /tmp/v -w "code=%{http_code}\n" "$W/webdl/api/version"
          cat /tmp/v; echo; echo
          echo "=== new endpoints must be locked without owner auth ==="
          for ep in admin/site admin/invites admin/disk admin/reload admin/pass admin/cookie_test admin/unban_all; do
            c=$(curl -sS -m 30 -A "$UA" -X POST -H 'Content-Type: application/json' -d '{}' -o /tmp/e -w "%{http_code}" "$W/webdl/api/$ep")
            echo "  $ep -> $c"
          done
          echo
          echo "=== user endpoints need a session ==="
          for ep in history pass report state; do
            c=$(curl -sS -m 30 -A "$UA" -X POST -H 'Content-Type: application/json' -d '{}' -o /tmp/e -w "%{http_code}" "$W/webdl/api/$ep")
            echo "  $ep -> $c"
          done
          echo
          echo "=== magnet accepted past validation (needs auth -> 401 not 400) ==="
          curl -sS -m 30 -A "$UA" -X POST -H 'Content-Type: application/json' \
            -d '{"url":"magnet:?xt=urn:btih:abcdef1234567890"}' -o /tmp/m -w "code=%{http_code}\n" "$W/webdl/api/start"
          cat /tmp/m; echo; echo
          echo "=== auth gates still correct ==="
          curl -sS -m 30 -A "$UA" -H 'Content-Type: application/json' -d '{"guest":1,"dev":"diagprobe80","fp":"fdiagprobe80"}' -o /tmp/g -w "guest code=%{http_code}\n" "$W/webdl/api/login"
          curl -sS -m 30 -A "$UA" -H 'Content-Type: application/json' -d '{"user":"nosuchuser","pass":"wrongpass","fp":"fdiagprobe80"}' -o /tmp/u -w "unknown-user code=%{http_code}\n" "$W/webdl/api/login"
          curl -sS -m 30 -A "$UA" -H 'Content-Type: application/json' -d '{"pass":"definitely-wrong-xyz"}' -o /tmp/w -w "wrong-owner-pass code=%{http_code}\n" "$W/webdl/api/login"
          echo
          echo "=== Pages page v18 checks ==="
          curl -sS -m 30 -A "$UA" -o /tmp/p2 -w "code=%{http_code}\n" "$P/"
          for kw in unbanAll data-adel data-aban data-ares Get\ from\ Pixeldrain qbar slots histCard chgPass announce sSave invMake wipeDone ckTest ownPass diskList histList data-ulim likeBtn inviteCode backend.json; do
            if grep -q "$kw" /tmp/p2; then echo "PASS: $kw"; else echo "FAIL: $kw missing"; fi
          done
          if grep -q "MediaFire" /tmp/p2; then echo "FAIL: MediaFire still in page"; else echo "PASS: no MediaFire references"; fi
          if grep -qE "https://[a-z0-9-]+\.workers\.dev" /tmp/p2; then echo "FAIL: worker URL in page"; else echo "PASS: no worker URL in page"; fi

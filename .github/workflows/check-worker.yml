name: Check Worker Kernels

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Install Kaggle CLI (pinned 1.6.17 for legacy auth)
        run: pip install kaggle==1.6.17

      - name: Pull Phase B worker logs + server-side metadata
        env:
          KAGGLE_USERNAME: ${{ secrets.KAGGLE_USERNAME }}
          KAGGLE_KEY: ${{ secrets.KAGGLE_KEY }}
        run: |
          for i in 1 2 3 4; do
            echo "========== wzml-worker-$i =========="
            mkdir -p out$i
            kaggle kernels output djoshi7/wzml-worker-$i -p out$i || echo "(pull failed)"
            echo "--- log tail ---"
            if [ -f out$i/wzml-worker-$i.log ]; then
              tail -c 4000 out$i/wzml-worker-$i.log
            else
              echo "(no log file)"
            fi
            echo ""
            echo "--- server-side metadata ---"
            mkdir -p meta$i
            kaggle kernels pull djoshi7/wzml-worker-$i -p meta$i -m || echo "(pull -m failed)"
            cat meta$i/kernel-metadata.json 2>/dev/null || true
            echo ""
          done

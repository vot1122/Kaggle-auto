name: Check DL Chain

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Probe the download link chain
        shell: bash
        run: |
          set +e
          UA='Mozilla/5.0 (Linux; Android 13) AppleWebKit/537.36 Chrome/120 Mobile Safari/537.36'
          ACC='text/html,application/xhtml+xml,application/xml;q=0.9,*/*;q=0.8'
          MAIN='https://twilight-thunder-4d48.joshifreefire-joshi.workers.dev'

          echo '===== 1. main worker /health ====='
          curl -sS -m 30 "$MAIN/health"
          echo; echo

          echo '===== 2. MAIN worker /dl/dummy?user=1 (what the Telegram D: button opens) ====='
          curl -sS -m 45 -A "$UA" -H "Accept: $ACC" -D /tmp/h1 -o /tmp/b1 -w 'http_code=%{http_code} content_type=%{content_type} size=%{size_download}\n' "$MAIN/dl/dummytoken123?user=1"
          echo '--- response headers ---'; cat /tmp/h1
          echo '--- body first 1200 bytes ---'; head -c 1200 /tmp/b1
          echo; echo

          echo '===== 3. MAIN worker /dl/dummy (no user param) ====='
          curl -sS -m 45 -A "$UA" -H "Accept: $ACC" -o /tmp/b2 -w 'http_code=%{http_code} content_type=%{content_type}\n' "$MAIN/dl/dummytoken123"
          echo '--- body first 600 bytes ---'; head -c 600 /tmp/b2
          echo; echo

          echo '===== 4. MAIN worker /stream/dummy?user=1 (playback kind - should stay raw 401) ====='
          curl -sS -m 45 -A "$UA" -H "Accept: $ACC" -o /tmp/b3 -w 'http_code=%{http_code} content_type=%{content_type}\n' "$MAIN/stream/dummytoken123?user=1"
          echo '--- body first 300 bytes ---'; head -c 300 /tmp/b3
          echo; echo

          echo '===== 5. auth route reachable ====='
          curl -sS -m 30 -X POST -H 'Content-Type: application/json' -d '{"password":"xyz-probe"}' "$MAIN/api/stream_auth"
          echo
